  <script>
  (async () => {
    const root = document.getElementById('sg-recipe-explorer');
    const view = root.querySelector('#sg-view');
    const route = root.querySelector('#sg-route');
    const announcement = root.querySelector('#sg-announcement');
    let data;
    try {
      const payload=root.querySelector('#stargate-data').textContent.trim();
      if(payload.startsWith('{'))data=JSON.parse(payload);
      else {
        const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        data=JSON.parse(await new Response(stream).text());
      }
    }
    catch (_) { view.textContent = 'No se pudieron cargar los datos de recetas.'; view.setAttribute('role','alert'); return; }
    if (!data.resources || !data.resources[data.root]) { view.textContent = 'No se encontró el recurso inicial.'; view.setAttribute('role','alert'); return; }
    const fmt = new Intl.NumberFormat('es-MX', {maximumFractionDigits:6});
    const stats=data.stats || {};
    const missing=stats.missing ?? stats.missingReferencedResources ?? 0;
    root.querySelector('#sg-version').textContent = `${data.version} · ${stats.rawRecipes?'Catálogo general':'Recorrido Stargate'} · ${fmt.format(stats.resources || 0)} recursos · ${fmt.format(stats.recipes || 0)} recetas`;
    if(missing>0)root.querySelector('.sg-heading').append(el('p','text-small',`${fmt.format(missing)} recursos con adquisición pendiente ${stats.rawRecipes?'en el catálogo general':'en este recorrido'}`));
    if(stats.quantitativeCompleteness===false)root.querySelector('.sg-heading').append(el('p','text-small','Cantidades por receta · sin suma total de materias primas'));
    const resource = id => data.resources[id] || {name:id,kind:'item',status:'missing'};
    const amountText = (id, amount) => `${typeof amount==='number' && Number.isFinite(amount) ? fmt.format(amount) : String(amount ?? '?')}${/fluid|fluido/i.test(resource(id).kind || '') ? ' mB' : resource(id).kind==='vis' ? ' vis' : ' ×'}`;
    const saved = window.openai && window.openai.widgetState;
    let history = [data.root];
    let selectedRecipes = {};
    let observer = null;
    let drawFrame = 0;
    function restore(state) {
      const p = state && state.privateContent;
      if (!p || p.version !== data.version || !Array.isArray(p.history)) return false;
      const h = p.history.filter(id => typeof id === 'string' && data.resources[id]);
      if (!h.length) return false;
      history = h.slice(-60);
      selectedRecipes={};
      if(p.selectedRecipes && typeof p.selectedRecipes==='object')Object.entries(p.selectedRecipes).slice(-80).forEach(([id,rid])=>{if(data.resources[id] && data.recipes[rid])selectedRecipes[id]=rid;});
      return true;
    }
    restore(saved);
    if(document.documentElement.hasAttribute('data-visualize-standalone')){
      const target=new URL(location.href).searchParams.get('item');
      if(target && data.resources[target])history=[data.root,target];
    }
    function persist() {
      const id = history[history.length - 1];
      if (window.openai && typeof window.openai.setWidgetState === 'function') {
        const state={modelContent:{resource:id,name:resource(id).name,recipe:selectedRecipes[id] || resource(id).recipe,version:data.version},privateContent:{version:data.version,history:history.slice(),selectedRecipes:{...selectedRecipes}}};
        while(new TextEncoder().encode(JSON.stringify(state)).length>14500){
          const keys=Object.keys(state.privateContent.selectedRecipes);
          const removable=keys.find(key=>key!==id);
          if(removable)delete state.privateContent.selectedRecipes[removable];
          else if(state.privateContent.history.length>1)state.privateContent.history.shift();
          else break;
        }
        Promise.resolve(window.openai.setWidgetState(state)).catch(() => {});
      }
    }
    function el(tag,cls,text) { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }
    function button(label,callback,cls='btn btn-ghost') { const n=el('button',cls,label); n.type='button'; n.addEventListener('click',callback); return n; }
    function navigate(id) {
      if (history[history.length - 1] === id) return;
      history.push(id); if(history.length>60)history.shift(); render(true);persist();
    }
    function go(index) { history = history.slice(0,index+1); render(true);persist(); }
    function makeNode(entry,output) {
      const res=resource(entry.id), wrap=el('div');
      const b=button('',()=>navigate(entry.id),'btn btn-block');
      b.dataset.node=entry.id;
      const quantity=entry.consumed===false && (entry.amount===0 || entry.amount==='0') ? '1 · reutilizable' : amountText(entry.id,entry.amount);
      b.append(el('span','sg-node-label',`${quantity} ${res.name}`));
      const tags=[];
      if(entry.consumed===false)tags.push('Reutilizable · no se consume');
      if(entry.toolWear)tags.push('Con desgaste');
      if(entry.consumptionByVariant)tags.push('Herramienta · consumo según variante');
      if(entry.returnedContainer)tags.push('Envase recuperado');
      if(entry.conditional===true)tags.push('Alternativa aleatoria');
      if(output && entry.chance!==undefined && Number(entry.chance)<1)tags.push(`Probabilidad: ${fmt.format(Number(entry.chance)*100)} %`);
      if(res.status==='raw')tags.push('Materia prima');
      if(res.status==='missing')tags.push('Receta pendiente de verificar');
      if(tags.length)b.append(el('span','sg-node-meta text-small',tags.join(' · ')));
      b.setAttribute('aria-label',`${b.textContent}. Consultar ${res.name}`);
      wrap.append(b);
      if(Array.isArray(entry.tooltip) && entry.tooltip.length){
        const details=el('details','text-small');details.append(el('summary','','Configuración / NBT'));
        entry.tooltip.forEach(t=>details.append(el('div','',t)));wrap.append(details);
      }
      const alternatives=Array.isArray(entry.alternatives) ? entry.alternatives.filter(id=>data.resources[id]) : [];
      if(alternatives.length) {
        const alt=el('div','sg-alt');alt.append(el('span','text-small','Alternativas:'));
        alternatives.forEach(id=>alt.append(button(resource(id).name,()=>navigate(id))));wrap.append(alt);
      }
      return wrap;
    }
    function render(focus=false) {
      if(observer)observer.disconnect();
      cancelAnimationFrame(drawFrame);
      view.replaceChildren();route.replaceChildren();
      const id=history[history.length-1], current=resource(id);
      const recipeIds=[...new Set([current.recipe,...(Array.isArray(current.recipes)?current.recipes:[])].filter(rid=>data.recipes && data.recipes[rid]))];
      const activeId=recipeIds.includes(selectedRecipes[id]) ? selectedRecipes[id] : current.status==='raw' ? null : recipeIds[0];
      const recipe=data.recipes && data.recipes[activeId];
      if(history.length>1)route.append(button('← Atrás',()=>go(history.length-2),'btn'));
      history.forEach((rid,index)=>{
        if(index)route.append(el('span','text-muted','›'));
        if(index===history.length-1){const label=el('span','',resource(rid).name);label.setAttribute('aria-current','page');route.append(label);}
        else route.append(button(resource(rid).name,()=>go(index)));
      });
      const title=el('h3','',current.name);title.id='sg-selected-title';view.append(title);
      if(recipeIds.length>1 || current.status==='raw' && recipeIds.length){
        const controls=el('div','viz-controls');const label=el('label','form-label','Receta');label.htmlFor='sg-recipe-select';
        const select=el('select','form-select');select.id='sg-recipe-select';
        if(current.status==='raw'){const o=el('option','','Recolección · fuente inicial');o.value='';select.append(o);}
        recipeIds.forEach((rid,index)=>{const r=data.recipes[rid];const o=el('option','',`${r.machine || 'Fabricación'} · ${Number.isFinite(r.durationTicks)?fmt.format(r.durationTicks/20)+' s':'tiempo no indicado'} · ${index+1}`);o.value=rid;select.append(o);});
        select.value=activeId || '';
        select.addEventListener('change',()=>{selectedRecipes[id]=select.value;const entries=Object.entries(selectedRecipes);if(entries.length>80)selectedRecipes=Object.fromEntries(entries.slice(-80));render();persist();const next=root.querySelector('#sg-recipe-select');if(next)next.focus({preventScroll:true});});
        controls.append(label,select);view.append(controls);
      }
      if(!recipe) {
        view.append(el('p','sg-empty',current.status==='raw' ? (current.acquisition || 'Materia prima; no requiere receta de fabricación en esta cadena.') : 'Receta pendiente de verificar'));
        if(current.alternativeGroup && current.alternatives){
          view.lastChild.textContent='Grupo de alternativas intercambiables';
          const options=el('div','viz-row');current.alternatives.filter(a=>data.resources[a]).forEach(a=>options.append(button(resource(a).name,()=>navigate(a),'btn')));view.append(options);
        }
      } else {
        const diagram=el('div','sg-diagram');diagram.setAttribute('role','group');diagram.setAttribute('aria-label','Diagrama de ingredientes a proceso y productos');
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('sg-edges');svg.setAttribute('aria-hidden','true');diagram.append(svg);
        const isResearch=current.kind==='research' || /^research:/.test(id);
        const inputs=el('section','sg-stage sg-inputs');inputs.append(el('p','sg-stage-label text-small',isResearch?'Muestras / soportes':'Ingredientes'));
        const list=el('div','sg-items');(recipe.inputs||[]).forEach(e=>list.append(makeNode(e,false)));inputs.append(list);
        if(!recipe.inputs || !recipe.inputs.length)list.append(el('span','text-small','Sin ingredientes consumidos'));
        const process=el('section','sg-stage sg-process');
        process.append(el('p','sg-stage-label text-small','Proceso'),el('h3','',recipe.machine || 'Fabricación'));
        if(recipe.tier)process.append(el('p','',recipe.tier));
        const manual=/^(Shaped Crafting|Shapeless Crafting|Extreme Crafting|Avaritia Extreme Crafting|Montaje|Quest reward|Natural acquisition|Selección aleatoria|Captura)/i.test(recipe.machine || '');
        if(!manual && Number.isFinite(recipe.durationTicks))process.append(el('p','tabular-nums',`${fmt.format(recipe.durationTicks/20)} s · ${fmt.format(recipe.durationTicks)} ticks`));
        if(!manual && Number.isFinite(recipe.eut))process.append(el('p','tabular-nums',`${fmt.format(recipe.eut)} EU/t`));
        if(!manual && Number.isFinite(recipe.durationTicks))process.append(el('p','text-small text-muted','Tiempo base · sin overclock'));
        const outputs=el('section','sg-stage sg-outputs');outputs.append(el('p','sg-stage-label text-small',isResearch?'Autorización de investigación':'Productos'));
        const outlist=el('div','sg-items');(recipe.outputs||[]).forEach(e=>outlist.append(makeNode(e,true)));outputs.append(outlist);
        diagram.append(inputs,process,outputs);view.append(diagram);
        if(recipe.grid && recipe.gridLegend){
          const layout=el('details','sg-conditions');layout.append(el('summary','','Disposición en la mesa de crafteo'));
          const table=el('table','table table-sm');table.setAttribute('aria-label','Cuadrícula de crafteo; punto: hueco vacío');
          const body=el('tbody');recipe.grid.forEach(row=>{const tr=el('tr');Array.from(row).forEach(ch=>{const td=el('td','text-center',ch==='-'?'·':ch);if(recipe.gridLegend[ch])td.setAttribute('data-tooltip',resource(recipe.gridLegend[ch]).name);tr.append(td);});body.append(tr);});table.append(body);layout.append(table);
          const legend=el('ul','text-small');Object.entries(recipe.gridLegend).forEach(([ch,rid])=>legend.append(el('li','',`${ch}: ${resource(rid).name}`)));layout.append(legend);view.append(layout);
        }
        if(recipe.conditions && recipe.conditions.length) {
          const details=el('details','sg-conditions');details.open=true;details.append(el('summary','',`Requisitos y condiciones (${recipe.conditions.length})`));
          const ul=el('ul');recipe.conditions.forEach(c=>ul.append(el('li','',c)));details.append(ul);view.append(details);
        }
        if(recipe.source){
          const p=el('p','sg-footer text-small text-muted');p.append(document.createTextNode('Fuente: '));
          try {const url=new URL(recipe.source);if(!['http:','https:'].includes(url.protocol))throw new Error('protocol');const a=el('a','',recipe.source);a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';p.append(a);}
          catch(_){p.append(document.createTextNode(recipe.source));}
          view.append(p);
        }
        const queue=()=>{cancelAnimationFrame(drawFrame);drawFrame=requestAnimationFrame(()=>drawEdges(diagram,svg,inputs,process,outputs));};
        if(typeof ResizeObserver!=='undefined'){observer=new ResizeObserver(queue);observer.observe(diagram);}queue();
      }
      announcement.textContent=`${current.name}. ${recipe ? (recipe.inputs||[]).length+' ingredientes.' : current.status==='raw'?'Materia prima.':'Receta pendiente de verificar.'}`;
      if(focus){ const back=route.querySelector('button'); if(back)back.focus({preventScroll:true}); }
    }
    function drawEdges(diagram,svg,inputs,process,outputs) {
      const base=diagram.getBoundingClientRect(), pr=process.getBoundingClientRect();
      const relative=n=>{const r=n.getBoundingClientRect();return {left:r.left-base.left,right:r.right-base.left,top:r.top-base.top,bottom:r.bottom-base.top,cx:(r.left+r.right)/2-base.left,cy:(r.top+r.bottom)/2-base.top};};
      const p=relative(process), w=base.width,h=base.height;
      svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();
      const ns='http://www.w3.org/2000/svg';
      const defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker');
      marker.id='sg-edge-arrow';marker.setAttribute('viewBox','0 0 8 8');marker.setAttribute('refX','7');marker.setAttribute('refY','4');marker.setAttribute('markerWidth','6');marker.setAttribute('markerHeight','6');marker.setAttribute('orient','auto');
      const arrow=document.createElementNS(ns,'path');arrow.setAttribute('d','M 0 0 L 8 4 L 0 8 z');arrow.setAttribute('fill','currentColor');marker.append(arrow);defs.append(marker);svg.append(defs);
      const path=d=>{const n=document.createElementNS(ns,'path');n.setAttribute('d',d);n.setAttribute('fill','none');n.setAttribute('stroke','currentColor');n.setAttribute('stroke-width','1');n.setAttribute('marker-end','url(#sg-edge-arrow)');svg.append(n);};
      const horizontal=w>=600;
      inputs.querySelectorAll('[data-node]').forEach(n=>{
        const r=relative(n);
        if(horizontal){const bus=p.left-17;path(`M ${r.right+2} ${r.cy} H ${bus} V ${p.cy} H ${p.left-4}`);}
        else {const bus=w-10;path(`M ${r.right+2} ${r.cy} H ${bus} V ${p.top-20} H ${p.cx} V ${p.top-5}`);}
      });
      outputs.querySelectorAll('[data-node]').forEach(n=>{
        const r=relative(n);
        if(horizontal){const bus=p.right+17;path(`M ${p.right+2} ${p.cy} H ${bus} V ${r.cy} H ${r.left-4}`);}
        else {const bus=8;path(`M ${p.cx} ${p.bottom+2} V ${p.bottom+20} H ${bus} V ${r.cy} H ${r.left-4}`);}
      });
    }
    window.addEventListener('openai:set_globals',e=>{if(e.detail && e.detail.globals && restore(e.detail.globals.widgetState))render();});
    render();
  })();
  </script>
</div>
